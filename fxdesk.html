<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌍 MacroDesk · Desk Forex / Crypto</title>
<link rel="icon" href="icons/icon-192.png">
<style>
  :root{
    --bg:#0e0e0c; --card:#1a1a17; --card2:#14140f; --line:#1a2440; --line2:#243156;
    --txt:#dbe4f5; --dim:#7c8db0; --faint:#4a5878;
    --red:#f43f5e; --green:#10b981; --amber:#fbbf24; --violet:#a78bfa; --teal:#2dd4bf; --blue:#60a5fa;
    --mono:'Consolas','SF Mono',monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--txt);font:14px/1.55 'Segoe UI',system-ui,sans-serif;padding-bottom:70px}
  .wrap{max-width:1180px;margin:0 auto;padding:0 18px}
  .mono{font-family:var(--mono)}
  a{color:var(--blue)}
  header{border-bottom:1px solid var(--line);padding:18px 0 14px;margin-bottom:18px}
  .hrow{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
  h1{font-size:20px;font-weight:700}
  h1 .shadow-tag{color:var(--violet);font-size:13px;border:1px solid var(--violet);border-radius:4px;padding:1px 8px;vertical-align:3px;margin-left:10px;letter-spacing:1px}
  .hmeta{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--dim)}
  .pill{border:1px solid var(--line2);background:var(--card);border-radius:20px;padding:3px 12px;white-space:nowrap}
  .pill b{color:var(--txt);font-weight:600}
  .ok{color:var(--green)} .warn{color:var(--amber)} .bad{color:var(--red)} .info{color:var(--blue)} .faint{color:var(--faint)}
  h2{font-size:12px;letter-spacing:2.5px;color:var(--faint);text-transform:uppercase;margin:30px 0 12px;display:flex;align-items:center;gap:10px}
  h2::after{content:'';flex:1;height:1px;background:var(--line)}
  h2 .src{margin-left:auto;font-size:10.5px;letter-spacing:0;text-transform:none;color:var(--faint);font-family:var(--mono);white-space:nowrap}
  h2::after{order:-1}
  .regime-band{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .regime{background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid var(--line2);border-radius:10px;padding:16px 18px;position:relative;overflow:hidden}
  .regime .mkt{font-size:11px;letter-spacing:2px;color:var(--dim)}
  .regime .verdict{font-size:21px;font-weight:700;margin:4px 0 2px}
  .regime .score{font-family:var(--mono);font-size:13px;color:var(--dim)}
  .regime .edge{position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--faint)}
  .conv{grid-column:1/-1;text-align:center;font-size:12.5px;color:var(--dim);background:var(--card);border:1px dashed var(--line2);border-radius:8px;padding:8px}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .card h3{font-size:13.5px;font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
  .badge{font-size:10px;letter-spacing:.6px;border-radius:3px;padding:1.5px 6px;font-weight:600;white-space:nowrap}
  .b-red{background:#2a0a12;color:var(--red);border:1px solid #58122a}
  .b-green{background:#04231a;color:var(--green);border:1px solid #0d4a37}
  .b-amber{background:#2b2005;color:var(--amber);border:1px solid #5c4409}
  .b-violet{background:#1d1638;color:var(--violet);border:1px solid #3d2f6e}
  .b-teal{background:#03262a;color:var(--teal);border:1px solid #0a4d52}
  .b-dim{background:#0d1424;color:var(--dim);border:1px solid var(--line2)}
  .src{margin-left:auto;font-size:10.5px;color:var(--faint);font-family:var(--mono);white-space:nowrap}
  .kv{display:flex;justify-content:space-between;padding:3.5px 0;border-bottom:1px solid #0d1528;font-size:13px;gap:8px}
  .kv:last-child{border-bottom:none}
  .kv .k{color:var(--dim)} .kv .v{font-family:var(--mono);text-align:right}
  .note{font-size:11.5px;color:var(--faint);margin-top:9px;padding-top:8px;border-top:1px dashed var(--line);line-height:1.45}
  table{width:100%;border-collapse:collapse;font-size:12.5px}
  th{font-size:10.5px;letter-spacing:1px;color:var(--faint);text-transform:uppercase;text-align:right;padding:5px 8px;border-bottom:1px solid var(--line)}
  th:first-child{text-align:left}
  td{padding:5.5px 8px;border-bottom:1px solid #0d1528;text-align:right;font-family:var(--mono)}
  td:first-child{text-align:left;font-family:'Segoe UI',sans-serif;font-weight:600}
  tr:last-child td{border-bottom:none}
  .s-strong{color:var(--green);font-weight:700} .s-weak{color:var(--red);font-weight:700} .s-mid{color:var(--dim)}
  td.reason,td.lbl{font-family:'Segoe UI',sans-serif;color:var(--faint);font-size:11.5px;text-align:left}
  /* tickets */
  .ticket{border-left:4px solid var(--faint);margin-bottom:10px}
  .ticket.filled{border-left-color:var(--green)}
  .ticket.pending{border-left-color:var(--amber)}
  .ticket.win{border-left-color:var(--teal)}
  .ticket.loss{border-left-color:var(--red)}
  .ticket.dead{border-left-color:var(--faint);opacity:.72}
  .ticket.refuse{border-left-color:var(--violet);opacity:.9}
  .trow{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
  .tid{font-family:var(--mono);font-size:11.5px;color:var(--faint)}
  .tinst{font-weight:700;font-size:15px}
  .tR{font-family:var(--mono);font-weight:700;font-size:15px;margin-left:auto}
  .lifeline{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px;font-size:11px}
  .life{border-radius:4px;padding:2px 8px;background:#0d1424;color:var(--dim);border:1px solid var(--line2);font-family:var(--mono)}
  .life.on{background:#04231a;color:var(--green);border-color:#0d4a37}
  .life.amber{background:#2b2005;color:var(--amber);border-color:#5c4409}
  .life.red{background:#2a0a12;color:var(--red);border-color:#58122a}
  /* horloges */
  .mkt-clock{background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:16px 18px;margin-bottom:14px}
  .mkt-clock>.head{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
  .mkt-clock>.head .t{font-weight:700;font-size:16px}
  .mkt-clock>.head .s{font-size:12px;color:var(--dim)}
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .cl{background:var(--card2);border:1px solid var(--line);border-radius:10px;padding:13px 15px;position:relative;overflow:hidden}
  .cl.pris{border-color:#0d4a37} .cl.ref{border-color:#3d2f6e}
  .cl .edge{position:absolute;left:0;top:0;bottom:0;width:3px}
  .cl.pris .edge{background:var(--green)} .cl.ref .edge{background:var(--violet)}
  .cl .lab{font-size:10.5px;letter-spacing:1.6px;text-transform:uppercase;color:var(--dim)}
  .cl.pris .lab{color:var(--green)} .cl.ref .lab{color:var(--violet)}
  .cl .n{font-family:var(--mono);font-size:27px;font-weight:700;margin:2px 0 0}
  .cl .n small{font-size:14px;color:var(--faint);font-weight:400}
  .bar{height:5px;background:#0d1528;border-radius:3px;margin:9px 0 8px;overflow:hidden}
  .bar i{display:block;height:100%;width:0}
  .cl.pris .bar i{background:var(--green)} .cl.ref .bar i{background:var(--violet)}
  .stats{display:flex;flex-wrap:wrap;gap:3px 12px;font-size:11.5px;color:var(--dim);font-family:var(--mono)}
  .stats b{color:var(--txt);font-weight:600}
  .verdict{margin-top:13px;border-top:1px dashed var(--line);padding-top:11px;font-size:13px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .tag{font-size:10.5px;letter-spacing:.6px;border-radius:4px;padding:2.5px 9px;font-weight:700;white-space:nowrap}
  .t-good{background:#04231a;color:var(--green);border:1px solid #0d4a37}
  .t-bad{background:#2a0a12;color:var(--red);border:1px solid #58122a}
  .t-wait{background:#0d1424;color:var(--faint);border:1px solid var(--line2)}
  .verdict .txt{flex:1;min-width:230px;color:var(--dim);font-size:12.5px}
  .verdict .txt b{color:var(--txt)}
  .empty{background:var(--card);border:1px dashed var(--line2);border-radius:10px;padding:22px;text-align:center;color:var(--faint);font-size:13px}
  .empty b{color:var(--dim)}
  .err{background:#2a0a12;border:1px solid #58122a;border-radius:10px;padding:14px 16px;color:#f0b2c0;font-size:13px;margin-bottom:12px}
  .err b{color:var(--red)}
  footer{margin-top:30px;text-align:center;color:var(--faint);font-size:11.5px;line-height:1.7}
  .spark{display:block}
  @media(max-width:860px){.regime-band,.pair{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="hrow">
    <h1>🌍 MacroDesk · Desk Forex&nbsp;/&nbsp;Crypto<span class="shadow-tag">SHADOW</span></h1>
    <div class="hmeta" id="hclock"></div>
  </div>
  <div class="hmeta" style="margin-top:10px" id="hsante"></div>
</header>

<div id="errors"></div>
<div id="app"></div>

<footer>
  Lecture seule · <span class="mono">data/fxdesk_regime.json</span> · <span class="mono">fxdesk_tickets.json</span> · <span class="mono">fxdesk_outcomes.json</span><br>
  Mode SHADOW — aucune position réelle. Le passage au réel se décide à la main, jamais automatiquement.
</footer>

</div>

<script>
'use strict';
/* ================= helpers ================= */
var $ = function(id){ return document.getElementById(id); };
function el(tag, cls, html){ var e = document.createElement(tag); if(cls) e.className = cls; if(html != null) e.innerHTML = html; return e; }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function num(v, d){ return (typeof v === 'number' && isFinite(v)) ? v.toFixed(d == null ? 2 : d) : '—'; }
function fmtR(r){ return (typeof r === 'number' && isFinite(r)) ? ((r > 0 ? '+' : '') + (Math.round(r * 100) / 100) + 'R') : '—'; }
function pct(v){ return (typeof v === 'number' && isFinite(v)) ? (v + ' %') : '—'; }
var JOURS = ['dim.','lun.','mar.','mer.','jeu.','ven.','sam.'];
/* horloge murale Nouméa (UTC+11, pas de DST) via getUTC* */
function nc(ms){ return new Date(ms + 11 * 3600e3); }
function ncStr(iso, withDay){
  var t = Date.parse(iso); if(!isFinite(t)) return '—';
  var d = nc(t), hh = ('0' + d.getUTCHours()).slice(-2), mm = ('0' + d.getUTCMinutes()).slice(-2);
  return (withDay ? JOURS[d.getUTCDay()] + ' ' + ('0' + d.getUTCDate()).slice(-2) + '/' + ('0' + (d.getUTCMonth() + 1)).slice(-2) + ' ' : '') + hh + ':' + mm;
}
function ageH(iso){ var t = Date.parse(iso); return isFinite(t) ? (Date.now() - t) / 3600e3 : null; }
function csiCls(v){ return v >= 55 ? 's-strong' : (v <= 45 ? 's-weak' : 's-mid'); }
function dirCls(d){ return d === 'long' ? 'ok' : 'bad'; }

/* ================= chargement ================= */
function getJSON(url){
  return fetch(url, { cache: 'no-store' }).then(function(r){
    if(r.status === 404) return null;
    if(!r.ok) throw new Error(url + ' : HTTP ' + r.status);
    return r.json();
  });
}

Promise.all([
  getJSON('data/fxdesk_regime.json').catch(function(e){ return { __err: e.message }; }),
  getJSON('data/fxdesk_tickets.json').catch(function(e){ return { __err: e.message }; }),
  getJSON('data/fxdesk_outcomes.json').catch(function(e){ return { __err: e.message }; })
]).then(function(res){ render(res[0], res[1], res[2]); })
 .catch(function(e){ $('errors').appendChild(el('div','err','<b>Chargement impossible</b> — ' + esc(e.message))); });

/* ================= rendu ================= */
function render(reg, tk, oc){
  var errs = $('errors');
  [['régime', reg], ['tickets', tk], ['outcomes', oc]].forEach(function(p){
    if(p[1] && p[1].__err) errs.appendChild(el('div','err','<b>' + p[0] + ' illisible</b> — ' + esc(p[1].__err)));
  });
  if(reg && reg.__err) reg = null;
  if(tk && tk.__err) tk = null;
  if(oc && oc.__err) oc = null;

  renderHeader(reg, tk, oc);
  var app = $('app');
  if(!reg){ app.appendChild(el('div','empty','<b>Régime indisponible</b><br>Le fichier data/fxdesk_regime.json n\'a pas pu être lu.')); }
  else {
    app.appendChild(secRegime(reg));
    app.appendChild(secCSI(reg));
    app.appendChild(secCotYsa(reg));
    app.appendChild(secShortlist(reg));
    app.appendChild(secNews(reg));
  }
  app.appendChild(secTickets(tk, oc));
  app.appendChild(secHorloges(oc));
  app.appendChild(secDecisions(tk, oc));
  app.appendChild(secSante(reg, tk, oc));
}

function renderHeader(reg, tk, oc){
  var now = nc(Date.now());
  var h = $('hclock');
  h.appendChild(el('span','pill', JOURS[now.getUTCDay()] + ' ' + ('0' + now.getUTCDate()).slice(-2) + '/' + ('0' + (now.getUTCMonth()+1)).slice(-2) + ' · <b>'
    + ('0'+now.getUTCHours()).slice(-2) + ':' + ('0'+now.getUTCMinutes()).slice(-2) + '</b> Nouméa'));

  var s = $('hsante');
  if(reg){
    var a = ageH(reg.generatedAt);
    var frais = (a != null && a <= 26);
    s.appendChild(el('span','pill','Régime : <b class="' + (frais ? 'ok' : 'bad') + '">'
      + (a == null ? 'inconnu' : (frais ? 'frais' : 'PÉRIMÉ') + ' (' + num(a,1) + ' h)') + '</b> · piece ' + esc(reg.piece)));
    var comp = (reg.coverage && reg.coverage.components) || {};
    var ks = Object.keys(comp), okN = ks.filter(function(k){ return comp[k] === 'OK'; }).length;
    s.appendChild(el('span','pill','Composants : <b class="' + (okN === ks.length ? 'ok' : 'warn') + '">' + okN + '/' + ks.length + '</b>'));
  }
  if(tk && tk.counters){
    s.appendChild(el('span','pill','Budget Opus jour : <b>' + (tk.counters.llmUsed || 0) + '/4</b>'));
  }
  if(oc){
    var la = oc.sante && oc.sante.lastRun;
    s.appendChild(el('span','pill','Outcomes : <b class="mono">' + (la ? ncStr(la, true) : '—') + '</b>'));
  } else {
    s.appendChild(el('span','pill faint','Outcomes : <b>pas encore de données</b>'));
  }
}

/* ---- régime ---- */
function secRegime(reg){
  var f = document.createDocumentFragment();
  f.appendChild(el('h2', null, 'Régime en vigueur<span class="src">' + esc(ncStr(reg.generatedAt, true)) + ' NC · 2×/j</span>'));
  var band = el('div','regime-band');
  var r = reg.regime || {};

  function box(mkt, o, extra){
    var d = el('div','regime');
    var sc = o && typeof o.score === 'number' ? o.score : null;
    var col = sc == null ? 'var(--faint)' : (sc > 0.5 ? 'var(--green)' : (sc < -0.5 ? 'var(--red)' : 'var(--faint)'));
    var e = el('div','edge'); e.style.background = col; d.appendChild(e);
    d.appendChild(el('div','mkt', mkt));
    d.appendChild(el('div','verdict', esc((o && o.label) || 'INDISPONIBLE')));
    d.appendChild(el('div','score', 'score ' + (sc == null ? '—' : (sc > 0 ? '+' : '') + num(sc)) + (o && o.confiance ? ' · confiance ' + esc(o.confiance) : '') + (o && o.dxyBias ? ' · DXY ' + esc(o.dxyBias) : '')));
    if(extra) d.appendChild(extra);
    return d;
  }
  var fx = r.forex || null;
  var xfx = el('div');
  if(fx){
    xfx.appendChild(el('div', null, '<span style="font-size:12.5px">Fortes : <b class="ok">' + esc((fx.fortes||[]).join(' · ') || '—')
      + '</b> &nbsp;·&nbsp; Faibles : <b class="bad">' + esc((fx.faibles||[]).join(' · ') || '—') + '</b></span>'));
    var ro = reg.riskOff || {}, vix = (ro.components && ro.components.vix && ro.components.vix.value);
    xfx.appendChild(el('div','stats','<span>Risk-Off <b>' + num(ro.score,0) + '</b> ' + esc(ro.label||'') + '</span><span>VIX <b>' + num(vix) + '</b></span>'
      + (reg.realizedVol && typeof reg.realizedVol.eurusd20dAnnPct === 'number' ? '<span>vol EURUSD <b>' + num(reg.realizedVol.eurusd20dAnnPct) + ' %</b></span>' : '')));
  }
  var cr = r.crypto || null;
  var xcr = el('div');
  if(cr){
    xcr.appendChild(el('div','stats','<span>DVOL <b>' + num(cr.dvol) + '</b> <span class="faint">(muet ≥ 75)</span></span>'
      + (reg.cryptoPulse && reg.cryptoPulse.components && reg.cryptoPulse.components.dominance ? '<span>Dominance BTC <b>' + num(reg.cryptoPulse.components.dominance.value) + ' %</b></span>' : '')));
    if(cr.prudence) xcr.appendChild(el('div','stats','<span class="warn">prudence : ' + esc(cr.prudence) + '</span>'));
  }
  band.appendChild(box('FOREX', fx, xfx));
  band.appendChild(box('CRYPTO', cr, xcr));

  var p = reg.pulses || {};
  var conv = [];
  if(p.liquidity) conv.push('Liquidité <b class="' + (p.liquidity.score > 0 ? 'ok' : 'bad') + '">' + (p.liquidity.score > 0 ? '+' : '') + num(p.liquidity.score) + ' ' + esc(p.liquidity.label) + '</b>');
  if(p.macroPulse) conv.push('Macro Pulse <b class="mono">' + num(p.macroPulse.score) + '</b> ' + esc(p.macroPulse.label));
  if(p.fomc) conv.push('FOMC <b class="warn">Hawkish ' + esc(p.fomc.score) + '</b>' + (p.fomc.detail ? ' <span class="faint">(' + esc(p.fomc.detail) + ')</span>' : ''));
  if(conv.length) band.appendChild(el('div','conv', conv.join(' · ')));
  f.appendChild(band);
  return f;
}

/* ---- CSI ---- */
function secCSI(reg){
  var f = document.createDocumentFragment();
  var csi = reg.csi;
  if(!csi || !csi.currencies) return f;
  f.appendChild(el('h2', null, 'CSI · forces des devises<span class="src">17 paires · 4 TF</span>'));
  var c = el('div','card');
  var TFs = ['Daily','4H','1H','15m'];
  var rows = Object.keys(csi.currencies).map(function(k){
    var o = csi.currencies[k], d = (csi.deltas && csi.deltas[k]) || {};
    return { cur: k, v: o, dj: d.daily_vs_hier };
  }).sort(function(a,b){ return (b.v.Daily||0) - (a.v.Daily||0); });
  var html = '<table><tr><th>Devise</th>' + TFs.map(function(t){ return '<th>' + t + '</th>'; }).join('') + '<th>Δ jour</th></tr>';
  rows.forEach(function(r){
    html += '<tr><td>' + esc(r.cur) + '</td>'
      + TFs.map(function(t){ var v = r.v[t]; return '<td class="' + csiCls(v) + '">' + num(v,1) + '</td>'; }).join('')
      + '<td class="' + (r.dj > 0 ? 's-strong' : (r.dj < 0 ? 's-weak' : 's-mid')) + '">' + (typeof r.dj === 'number' ? (r.dj > 0 ? '+' : '') + num(r.dj,1) : '—') + '</td></tr>';
  });
  html += '</table>';
  c.innerHTML = html;
  c.appendChild(el('div','note','Vert ≥ 55 · rouge ≤ 45. Un instrument RETENU exige la convergence de plusieurs TF sans contre-signal.'));
  f.appendChild(c);
  return f;
}

/* ---- COT + YSA ---- */
function secCotYsa(reg){
  var f = document.createDocumentFragment();
  if(!reg.cot && !reg.ysa) return f;
  f.appendChild(el('h2', null, 'Positionnement &amp; ancres macro'));
  var g = el('div','grid');
  if(reg.cot && reg.cot.currencies){
    var c1 = el('div','card');
    c1.appendChild(el('h3', null, 'COT institutionnel <span class="badge b-dim">' + esc(reg.cot.reportDate || '') + '</span><span class="src">' + esc(reg.cot.live) + '/' + esc(reg.cot.total) + ' devises</span>'));
    var cur = reg.cot.currencies;
    Object.keys(cur).filter(function(k){ return cur[k].direction && cur[k].direction !== 'AUCUN'; }).slice(0,5).forEach(function(k){
      var o = cur[k];
      c1.appendChild(el('div','kv','<span class="k">' + esc(k) + '</span><span class="v ' + (o.direction === 'LONG' ? 'ok' : 'bad') + '">' + esc(o.direction) + ' · N' + esc(o.level) + ' · conviction ' + esc(o.conviction) + '</span>'));
    });
    var pairs = reg.cot.pairs || {};
    var actifs = Object.keys(pairs).filter(function(k){ return pairs[k].direction && pairs[k].direction !== 'AUCUN'; });
    c1.appendChild(el('div','kv','<span class="k">Paires orientées</span><span class="v">' + (actifs.length ? actifs.map(function(k){ return esc(k) + ' <span class="' + (pairs[k].direction === 'LONG' ? 'ok' : 'bad') + '">' + esc(pairs[k].direction) + ' ' + esc(pairs[k].conviction) + '</span>'; }).join(' · ') : '<span class="faint">aucune</span>') + '</span>'));
    g.appendChild(c1);
  }
  if(reg.ysa && reg.ysa.pairs){
    var c2 = el('div','card');
    c2.appendChild(el('h3', null, 'YSA · ancres <span class="badge b-dim">Pearson 90 j</span><span class="src">seuils 0.40 / 2σ</span>'));
    var yp = reg.ysa.pairs;
    Object.keys(yp).forEach(function(k){
      var o = yp[k], cls = 'faint', txt;
      if(o.status === 'OK' && o.regime === 'NORMAL'){ cls = 'ok'; txt = 'NORMAL · corr ' + num(o.corr) + ' · z-gap ' + num(o.zGap); }
      else if(o.status === 'OK' && o.regime === 'BROKEN'){ cls = 'bad'; txt = 'BROKEN · corr ' + num(o.corr) + ' → véto'; }
      else txt = 'non câblé';
      c2.appendChild(el('div','kv','<span class="k">' + esc(k) + (o.anchor ? ' <span class="faint">↔ ' + esc(o.anchor) + '</span>' : '') + '</span><span class="v ' + cls + '">' + txt + '</span>'));
    });
    g.appendChild(c2);
  }
  f.appendChild(g);
  return f;
}

/* ---- shortlist ---- */
function secShortlist(reg){
  var f = document.createDocumentFragment();
  var sl = reg.shortlist;
  if(!sl || !sl.instruments) return f;
  f.appendChild(el('h2', null, 'Shortlist du jour<span class="src">' + esc(sl.retenus) + ' retenu(s) · ' + esc(sl.candidats) + ' candidat(s) · ' + esc(sl.total) + ' instruments</span>'));
  var c = el('div','card');
  var ins = sl.instruments;
  var html = '<table><tr><th>Instrument</th><th style="text-align:left">Statut</th><th style="text-align:left">Raison</th></tr>';
  var ordre = { RETENU: 0, CANDIDAT: 1, ECARTE: 2 };
  Object.keys(ins).sort(function(a,b){ return (ordre[ins[a].statut] == null ? 3 : ordre[ins[a].statut]) - (ordre[ins[b].statut] == null ? 3 : ordre[ins[b].statut]); }).forEach(function(k){
    var o = ins[k];
    var cls = o.statut === 'RETENU' ? 'ok' : (o.statut === 'CANDIDAT' ? 'warn' : 'faint');
    html += '<tr><td>' + esc(k) + '</td><td class="lbl ' + cls + '">' + esc(o.statut) + (o.direction ? ' ' + esc(String(o.direction).toUpperCase()) : '') + '</td><td class="reason">' + esc(o.raison || '') + '</td></tr>';
  });
  html += '</table>';
  c.innerHTML = html;
  if(sl.note) c.appendChild(el('div','note', esc(sl.note)));
  f.appendChild(c);
  return f;
}

/* ---- calendrier / news ---- */
function secNews(reg){
  var f = document.createDocumentFragment();
  var nw = reg.news;
  if(!nw) return f;
  f.appendChild(el('h2', null, 'Calendrier économique<span class="src">' + esc(nw.source || '') + '</span>'));
  if(nw.status !== 'OK'){
    f.appendChild(el('div','empty','<b>Calendrier indisponible</b><br>' + esc(nw.error || nw.note || '') + '<br><span class="faint">Le desk continue sur sa table de vétos codée (fail-soft).</span>'));
    return f;
  }
  var g = el('div','grid');
  var c1 = el('div','card');
  c1.appendChild(el('h3', null, 'À venir (72 h) <span class="badge b-red">véto ±45 min</span>'));
  if(!(nw.upcoming || []).length) c1.appendChild(el('div','kv','<span class="k faint">aucun événement rouge sous 72 h</span><span class="v"></span>'));
  (nw.upcoming || []).slice(0,8).forEach(function(e){
    c1.appendChild(el('div','kv','<span class="k">' + esc(ncStr(e.t, true)) + ' NC</span><span class="v warn">' + esc(e.label) + '</span>'));
  });
  g.appendChild(c1);
  var c2 = el('div','card');
  c2.appendChild(el('h3', null, 'Passés (48 h)'));
  if(!(nw.recent || []).length) c2.appendChild(el('div','kv','<span class="k faint">aucun</span><span class="v"></span>'));
  (nw.recent || []).slice(0,6).forEach(function(e){
    c2.appendChild(el('div','kv','<span class="k">' + esc(ncStr(e.t, true)) + ' NC</span><span class="v faint">' + esc(e.label)
      + (e.forecast ? ' <span class="dim">prév. ' + esc(e.forecast) + '</span>' : '') + '</span>'));
  });
  c2.appendChild(el('div','note', esc(nw.note || '')));
  g.appendChild(c2);
  f.appendChild(g);
  return f;
}

/* ---- tickets ---- */
function secTickets(tk, oc){
  var f = document.createDocumentFragment();
  f.appendChild(el('h2', null, 'Tickets SHADOW<span class="src">fxdesk_tickets.json</span>'));
  var list = (tk && tk.tickets) || [];
  if(!list.length){
    f.appendChild(el('div','empty','<b>Aucun ticket émis à ce jour</b><br>Le desk ne fabrique pas de trade pour remplir un quota — un scan sans setup est un résultat valide.'));
    return f;
  }
  var track = (oc && oc.tracking) || {};
  list.slice().reverse().slice(0, 30).forEach(function(t){
    var tr = track[t.id] || null;
    var refuse = t.status === 'REJECTED';
    var st = tr && tr.state;
    var cls = 'card ticket ' + (refuse ? 'refuse' : (st === 'CLOSED' ? (tr.resultR > 0 ? 'win' : 'loss') : (st === 'FILLED' ? 'filled' : (st === 'PENDING' ? 'pending' : 'dead'))));
    var c = el('div', cls);
    var row = el('div','trow');
    row.appendChild(el('span','tinst', esc(t.instrument) + ' <span class="' + dirCls(t.direction) + '">' + esc(String(t.direction||'').toUpperCase()) + '</span>'));
    row.appendChild(el('span','badge ' + (refuse ? 'b-violet' : 'b-green'), refuse ? 'REFUSÉ' : 'PRIS'));
    if(st) row.appendChild(el('span','badge b-dim', esc(st)));
    row.appendChild(el('span','badge b-dim', esc(t.orderType) + ' · ' + esc(t.setupType)));
    if(t.profile) row.appendChild(el('span','badge b-dim', esc(t.profile)));
    var vs = t.verdict && typeof t.verdict.score === 'number' ? t.verdict.score : null;
    row.appendChild(el('span','tid', esc(t.id) + (vs != null ? ' · Opus ' + vs + '/100' : '') + ' · ' + esc(ncStr(t.generatedAt, true)) + ' NC'));
    var rv = tr && (typeof tr.resultR === 'number' ? tr.resultR : (typeof tr.latentR === 'number' ? tr.latentR : null));
    row.appendChild(el('span','tR ' + (rv == null ? 'faint' : (rv > 0 ? 'ok' : 'bad')),
      rv == null ? ('entrée ' + num(t.entry, 5)) : (fmtR(rv) + (tr.state === 'FILLED' ? ' <span class="faint" style="font-size:11px;font-weight:400">latent</span>' : ''))));
    c.appendChild(row);

    var life = el('div','lifeline');
    life.appendChild(el('span','life', 'entrée ' + num(t.entry,5) + ' · SL ' + num(t.sl,5) + ' · T1 ' + num(t.t1,5)));
    if(typeof t.slDistAtr === 'number') life.appendChild(el('span','life' + (t.slDistAtr >= 1 ? ' on' : ' amber'), 'risque ' + num(t.slDistAtr) + '×ATR'));
    if(tr && tr.events) tr.events.forEach(function(ev){ life.appendChild(el('span','life' + (ev.k === 'SL' || ev.k === 'SL_SAMEBAR' ? ' red' : (ev.k === 'T1' ? ' on' : '')), esc(ev.k) + ' ' + esc(ncStr(ev.t)))); });
    if(refuse && t.rejectReason) life.appendChild(el('span','life', 'motif : ' + esc(t.rejectReason)));
    c.appendChild(life);

    if(t.verdict && (t.verdict.raisons || []).length){
      c.appendChild(el('div','note', '<b>Opus</b> · ' + (t.verdict.raisons || []).map(esc).join(' · ')));
    }
    f.appendChild(c);
  });
  return f;
}

/* ---- horloges ---- */
function secHorloges(oc){
  var f = document.createDocumentFragment();
  f.appendChild(el('h2', null, 'Horloges SHADOW<span class="src">n = clos déclenchés</span>'));
  if(!oc || !oc.clocks){
    f.appendChild(el('div','empty','<b>Pas encore de mesure</b><br>Le workflow Outcomes n\'a pas encore publié de résultats.'));
    return f;
  }
  [['🌍 FOREX','FX'],['₿ CRYPTO','CRYPTO']].forEach(function(m){
    var o = oc.clocks[m[1]];
    if(!o) return;
    var p = o.pris || o, r = o.refuse || null, e = o.edge || null;
    var box = el('div','mkt-clock');
    var head = el('div','head');
    head.appendChild(el('span','t', m[0]));
    head.appendChild(el('span','s', 'le réel ne s\'envisage qu\'à 30 PRIS et stats saines — décision manuelle'));
    box.appendChild(head);

    var pair = el('div','pair');
    function clock(o2, isPris){
      var d = el('div','cl ' + (isPris ? 'pris' : 'ref'));
      d.appendChild(el('div','edge'));
      d.appendChild(el('div','lab', isPris ? '✅ Pris — tickets émis' : '🚫 Refusé — contrefactuel'));
      d.appendChild(el('div','n', (o2.n || 0) + (isPris ? '<small>/30</small>' : '<small> jugés</small>')));
      var bar = el('div','bar'); var i = el('i'); i.style.width = Math.min(100, (o2.n || 0) / 30 * 100) + '%'; bar.appendChild(i); d.appendChild(bar);
      var st = [];
      st.push('<span>' + (o2.wins||0) + 'W · ' + (o2.losses||0) + 'L</span>');
      if(o2.n) st.push('<span>WR <b>' + pct(o2.winRatePct) + '</b></span>', '<span>moy <b>' + fmtR(o2.avgR) + '</b></span>', '<span>Σ <b>' + fmtR(o2.sumR) + '</b></span>');
      if(o2.profitFactor != null) st.push('<span>PF ' + num(o2.profitFactor) + '</span>');
      if(o2.maxDrawdownR) st.push('<span>DD ' + fmtR(o2.maxDrawdownR) + '</span>');
      d.appendChild(el('div','stats', st.join('')));
      return d;
    }
    pair.appendChild(clock(p, true));
    if(r) pair.appendChild(clock(r, false));
    box.appendChild(pair);

    if(e){
      var v = el('div','verdict');
      var tag = e.verdict === 'GATE_CREE_VALEUR' ? ['t-good','LE GATE CRÉE DE LA VALEUR']
              : (e.verdict === 'GATE_DETRUIT_VALEUR' ? ['t-bad','LE GATE DÉTRUIT DE LA VALEUR'] : ['t-wait','ÉCHANTILLON INSUFFISANT']);
      v.appendChild(el('span','tag ' + tag[0], tag[1]));
      var txt = e.verdict === 'ECHANTILLON_INSUFFISANT'
        ? (e.decisions || 0) + ' décision(s) — aucun verdict avant <b>' + (e.minDecisions || 20) + '</b>. On observe, on ne conclut pas.'
        : 'Écart <b>' + fmtR(e.ecartR) + ' par décision</b> sur ' + e.decisions + ' arbitrages. ' + esc(e.note || '');
      v.appendChild(el('span','txt', txt));
      box.appendChild(v);
    }
    var hors = [];
    if(p.expired) hors.push(p.expired + ' expiré(s)');
    if(p.cancelled) hors.push(p.cancelled + ' annulé(s)');
    if(p.frozen) hors.push(p.frozen + ' gelé(s)');
    if(p.open) hors.push(p.open + ' en cours');
    if(hors.length) box.appendChild(el('div','note','Hors horloge : ' + hors.join(' · ') + '. Les expirés et annulés restent visibles mais ne comptent jamais comme trades.'));
    f.appendChild(box);
  });
  if(oc.clocks.note) f.appendChild(el('div','note', esc(oc.clocks.note)));
  return f;
}

/* ---- tableau des décisions ---- */
function secDecisions(tk, oc){
  var f = document.createDocumentFragment();
  var track = (oc && oc.tracking) || {};
  var ids = Object.keys(track);
  if(!ids.length) return f;
  f.appendChild(el('h2', null, 'Décisions vérifiées<span class="src">chaque refus devient auditable</span>'));
  var c = el('div','card');
  var byId = {};
  ((tk && tk.tickets) || []).forEach(function(t){ byId[t.id] = t; });
  var html = '<table><tr><th>Ticket</th><th style="text-align:left">Décision</th><th>Verdict</th><th style="text-align:left">Issue</th><th>Résultat</th></tr>';
  ids.sort(function(a,b){ return (track[b].emission || '') < (track[a].emission || '') ? -1 : 1; }).slice(0,40).forEach(function(id){
    var r = track[id], t = byId[id] || {};
    var pris = r.pris !== false;
    var issue = r.state === 'CLOSED' ? ((r.events||[]).map(function(e){ return e.k; }).join('→') || 'clos')
              : (r.state === 'FILLED' ? 'en cours' : (r.state || '—').toLowerCase());
    var res, cls;
    if(r.state === 'CLOSED'){
      if(pris){ res = fmtR(r.resultR); cls = r.resultR > 0 ? 'ok' : 'bad'; }
      else if(r.resultR < 0){ res = fmtR(-r.resultR) + ' évité'; cls = 'ok'; }
      else { res = fmtR(r.resultR) + ' manqué'; cls = 'bad'; }
    } else if(r.state === 'FILLED'){ res = fmtR(r.latentR) + ' latent'; cls = r.latentR > 0 ? 'ok' : 'bad'; }
    else { res = 'hors horloge'; cls = 'faint'; }
    html += '<tr><td>' + esc(r.instrument || id) + ' ' + esc(r.direction || '') + '</td>'
      + '<td class="lbl ' + (pris ? 'ok' : 'v') + '" style="color:' + (pris ? 'var(--green)' : 'var(--violet)') + '">' + (pris ? 'PRIS' : 'REFUSÉ') + '</td>'
      + '<td>' + (r.verdictScore != null ? esc(r.verdictScore) : '—') + '</td>'
      + '<td class="reason">' + esc(issue) + '</td>'
      + '<td class="' + cls + '">' + res + '</td></tr>';
  });
  html += '</table>';
  c.innerHTML = html;
  c.appendChild(el('div','note','Un refus « bien joué » affiche la perte évitée en vert ; un refus « raté » affiche le gain manqué en rouge. C\'est ce tableau qui rend le seuil discutable sur des faits.'));
  f.appendChild(c);
  return f;
}

/* ---- santé ---- */
function secSante(reg, tk, oc){
  var f = document.createDocumentFragment();
  f.appendChild(el('h2', null, 'Santé du desk'));
  var c = el('div','card');
  if(reg){
    var a = ageH(reg.generatedAt);
    c.appendChild(el('div','kv','<span class="k">Régime</span><span class="v ' + (a != null && a <= 26 ? 'ok' : 'bad') + '">' + (a == null ? '—' : num(a,1) + ' h') + ' <span class="faint">(alerte &gt; 26 h)</span></span>'));
    var comp = (reg.coverage && reg.coverage.components) || {};
    var ko = Object.keys(comp).filter(function(k){ return comp[k] !== 'OK'; });
    c.appendChild(el('div','kv','<span class="k">Composants</span><span class="v ' + (ko.length ? 'warn' : 'ok') + '">' + (ko.length ? ko.map(function(k){ return esc(k) + ' : ' + esc(comp[k]); }).join(' · ') : 'tous OK') + '</span>'));
  }
  if(tk && tk.counters){
    var pi = tk.counters.perInstrumentLLM || {};
    c.appendChild(el('div','kv','<span class="k">Budget Opus (' + esc(tk.counters.dateNC || '') + ')</span><span class="v">' + (tk.counters.llmUsed || 0) + '/4 · ' + (Object.keys(pi).length ? Object.keys(pi).map(function(k){ return esc(k); }).join(', ') : '—') + '</span>'));
  }
  if(oc){
    c.appendChild(el('div','kv','<span class="k">Dernier run Outcomes</span><span class="v">' + esc(oc.sante && oc.sante.lastRun ? ncStr(oc.sante.lastRun, true) + ' NC' : '—') + '</span>'));
    var al = (oc.sante && oc.sante.alerts) || [];
    c.appendChild(el('div','kv','<span class="k">Alertes</span><span class="v ' + (al.length ? 'warn' : 'ok') + '">' + (al.length ? al.map(esc).join('<br>') : 'aucune') + '</span>'));
    if(oc.lastTest) c.appendChild(el('div','kv','<span class="k faint">Dernière recette TEST</span><span class="v faint">' + esc(ncStr(oc.lastTest.at, true)) + ' NC' + (oc.lastTest.replay ? ' · ' + esc(oc.lastTest.replay.state) + ' ' + fmtR(oc.lastTest.replay.resultR) : '') + '</span>'));
  } else {
    c.appendChild(el('div','kv','<span class="k">Outcomes</span><span class="v faint">fichier absent — le workflow n\'a pas encore publié</span>'));
  }
  c.appendChild(el('div','note','Aucune donnée n\'est inventée : une source absente s\'affiche ABSENT, jamais remplacée par une valeur par défaut.'));
  f.appendChild(c);
  return f;
}
